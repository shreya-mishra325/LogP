<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinator · {{.Name}}</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/operator.js"></script>
</head>
<body><main>
<header><h1>{{.Name}} Coordinator</h1><p>{{.Description}}</p><a href="/worker">Open worker page</a></header>
<label>Operator credential <input id="token" type="password" autocomplete="off" maxlength="512"></label>
<label>Job ID <input id="job" maxlength="64" autocomplete="off"></label>
<div class="actions"><button id="watch">Watch</button><button id="cancel" disabled>Cancel job</button><button id="download" disabled>Download PNG</button></div>
<p id="status" role="status">Enter a credential to view workers or a job ID to watch tiles.</p>
<dl><dt>Accepted tiles</dt><dd id="accepted">—</dd><dt>Retries queued</dt><dd id="retries">—</dd><dt>Elapsed</dt><dd id="elapsed">—</dd></dl>
<canvas id="image" width="1" height="1" aria-label="Accepted Mandelbrot tiles" hidden></canvas>
<h2>Worker sessions</h2>
<p id="counts"></p>
<ul id="workers"></ul>
</main></body>
</html>
